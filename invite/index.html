<!DOCTYPE html>
<html lang="pt-PT">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Margarida &amp; Gonçalo — Convite</title>
	<link rel="icon" href="../images/favicon-32x32.png?v=6" sizes="32x32" type="image/png">
	<link rel="icon" href="../images/favicon-16x16.png?v=6" sizes="16x16" type="image/png">
	<link rel="icon" href="../images/favicon.ico?v=6" sizes="any">
	<link rel="apple-touch-icon" href="../images/apple-touch-icon.png?v=6">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../invite.css" />
</head>
<body>
	<div class="envelope-clip" id="envelopeClip" role="button" tabindex="0" aria-label="Abrir convite de casamento">
		<div class="envelope-shape">
			<div class="pocket"></div>
			<div class="flap"></div>
		</div>
		<div class="texture" aria-hidden="true"></div>
		<div class="seal">
			<img src="../images/logo.webp" alt="Margarida e Gonçalo" width="132" height="160" />
		</div>
		<p class="invite-hint" id="inviteHint">Toca para abrir o convite</p>
	</div>

	<script>
		const clip = document.getElementById('envelopeClip');
		const hint = document.getElementById('inviteHint');
		const hintText = hint.textContent;
		let navTimer;

		function goToSite() {
			window.location.href = '/';
		}

		function handleActivate() {
			if (clip.classList.contains('open')) return;
			clip.classList.add('open');
			hint.textContent = '';
			// A aba já está praticamente invisível aos ~800ms; não vale a pena esperar mais
			navTimer = setTimeout(goToSite, 800);
		}

		// Enquanto o convidado olha para o envelope, vai buscando o site,
		// para que ao tocar a página seguinte já esteja em cache.
		function warmUpSite() {
			fetch('/', { credentials: 'same-origin' }).catch(() => {});
			fetch('/styles.css').catch(() => {});
			new Image().src = '/images/noivos/foto.webp';
		}
		window.addEventListener('load', () => {
			if ('requestIdleCallback' in window) {
				requestIdleCallback(warmUpSite, { timeout: 1000 });
			} else {
				setTimeout(warmUpSite, 200);
			}
		});

		function closeEnvelope() {
			clearTimeout(navTimer);
			clip.classList.remove('open');
			hint.textContent = hintText;
		}

		// Ao voltar atrás, o browser pode restaurar a página tal como estava
		// (back-forward cache), com o envelope aberto. Fecha-o de novo.
		window.addEventListener('pageshow', e => {
			if (e.persisted) closeEnvelope();
		});

		clip.addEventListener('click', handleActivate);
		clip.addEventListener('keydown', e => {
			if (e.key === 'Enter' || e.key === ' ') {
				e.preventDefault();
				handleActivate();
			}
		});
	</script>
</body>
</html>
